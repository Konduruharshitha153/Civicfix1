version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres_db:
    image: postgres:16-alpine
    container_name: civicfix_postgres
    restart: always
    environment:
      POSTGRES_USER: civicfix_user
      POSTGRES_PASSWORD: civicfix_password
      POSTGRES_DB: civicfix_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./backend/database/seed_data.sql:/docker-entrypoint-initdb.d/2_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicfix_user -d civicfix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Flask Python Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicfix_backend
    restart: always
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://civicfix_user:civicfix_password@postgres_db:5432/civicfix_db
      SECRET_KEY: civicfix-docker-jwt-secret-key-32chars
      JWT_SECRET_KEY: civicfix-docker-jwt-access-secret-32chars
      UPLOAD_FOLDER: uploads
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres_db:
        condition: service_healthy

 # 3. React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicfix_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
